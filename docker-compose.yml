services:
  db:
    # pgvector/pgvector:pg16 is upstream postgres:16 with the pgvector
    # extension precompiled - plain postgres:16(-alpine) has no `CREATE
    # EXTENSION vector` to enable.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
      POSTGRES_DB: titan
    ports:
      - "5433:5432"
    volumes:
      - titan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # 6380 (not the default 6379) to avoid clashing with any Redis already
      # running locally, same reasoning as the db service's 5433 mapping.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Observability (opt-in): docker compose --profile observability up -d
  # Prometheus scrapes the API's GET /metrics (API runs on the host via uvicorn)
  # plus Postgres/Redis exporters; Grafana reads Prometheus and Titan's Postgres.
  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - titan_prom_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - titan_grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on: [prometheus, db]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    profiles: [observability]
    environment:
      DATA_SOURCE_NAME: postgresql://titan:titan@db:5432/titan?sslmode=disable
    depends_on: [db]

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    profiles: [observability]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on: [redis]

volumes:
  titan_pg_data:
  titan_prom_data:
  titan_grafana_data:
