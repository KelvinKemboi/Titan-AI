services:
  db:
    # pgvector/pgvector:pg16 is upstream postgres:16 with the pgvector
    # extension precompiled - plain postgres:16(-alpine) has no `CREATE
    # EXTENSION vector` to enable.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: titan
      POSTGRES_PASSWORD: titan
      POSTGRES_DB: titan
    ports:
      - "5433:5432"
    volumes:
      - titan_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  titan_pg_data:
