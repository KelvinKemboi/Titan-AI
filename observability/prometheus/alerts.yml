groups:
  - name: titan
    rules:
      - alert: TitanApiDown
        expr: up{job="titan-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Titan API is not being scraped (down or /metrics unreachable)"

      - alert: TitanHighErrorRate
        expr: |
          sum(rate(titan_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(titan_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests are returning 5xx"

      - alert: TitanChatLLMFailing
        # llm_error = the user got the "Sorry, I ran into a problem" fallback.
        expr: |
          sum(rate(titan_chat_turns_total{outcome="llm_error"}[10m]))
            / clamp_min(sum(rate(titan_chat_turns_total[10m])), 1e-9) > 0.2
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Over 20% of chat turns are falling back due to LLM errors (bad API key? rate limit?)"

      - alert: TitanChatSlow
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(titan_http_request_duration_seconds_bucket{route="/chat"}[10m]))) > 30
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "p95 /chat latency above 30s"

      - alert: TitanLLMSpendSpike
        expr: sum(rate(titan_llm_cost_usd_total[1h])) * 3600 > 5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Estimated LLM spend is running above $5/hour"

      - alert: TitanPostgresDown
        expr: pg_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Postgres exporter cannot reach the database"

      - alert: TitanRedisDown
        expr: redis_up == 0
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Redis is down - /rankings and /company fall back to uncached DB reads"
