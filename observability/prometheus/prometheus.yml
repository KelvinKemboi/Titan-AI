global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # FastAPI gateway running on the host (`uvicorn src.api.main:app --port 8000`).
  # host.docker.internal is mapped to the host in docker-compose.yml (extra_hosts),
  # so this works on Linux as well as Docker Desktop.
  - job_name: titan-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
